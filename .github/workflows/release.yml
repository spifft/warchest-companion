# Builds, signs and publishes Warchest Companion when a version tag (v1.2.3) is pushed.
# Signing uses Microsoft's Azure Artifact Signing, logged in with GitHub's short-lived identity (no stored password).
# Set up once (see docs/SIGNING.md), as repository variables (Settings > Secrets and variables > Actions > Variables):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, SIGNING_ENDPOINT, SIGNING_ACCOUNT, SIGNING_PROFILE
# Without them the release is built unsigned (and says so in its notes).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write    # create the release
  id-token: write    # log in to Azure for signing

jobs:
  release:
    runs-on: windows-2022
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Version
        id: v
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Icon and version details for Windows
        shell: bash
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          cd cmd/companion
          go-winres simply --icon ../../assets/icon.ico --manifest gui \
            --product-name "Warchest Companion" --file-description "Warchest Companion: relays Trade chat to Crossroads" \
            --product-version "${{ steps.v.outputs.version }}" --file-version "${{ steps.v.outputs.version }}" \
            --copyright "LANrat, warchestmod.com" --original-filename "WarchestCompanion.exe"

      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=${{ steps.v.outputs.version }}" -o dist/WarchestCompanion.exe ./cmd/companion

      - name: Azure login (for signing)
        if: ${{ vars.SIGNING_ACCOUNT != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign
        if: ${{ vars.SIGNING_ACCOUNT != '' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the signature
        if: ${{ vars.SIGNING_ACCOUNT != '' }}
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature dist\WarchestCompanion.exe
          Write-Host "Signature: $($s.Status) by $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { throw "The file isn't validly signed" }

      - name: Checksum
        shell: bash
        run: cd dist && sha256sum WarchestCompanion.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          signed="Signed by the Warchest publisher through Microsoft Azure Artifact Signing."
          [ -z "${{ vars.SIGNING_ACCOUNT }}" ] && signed="This build is not signed yet: Windows will warn before running it."
          sum=$(cut -d' ' -f1 dist/SHA256SUMS.txt)
          cat > notes.md <<EOF
          Warchest Companion ${{ steps.v.outputs.version }} for Windows.

          Download **WarchestCompanion.exe**, run it, and connect it to your Warchest account. Help: https://warchestmod.com/companion.html

          $signed

          SHA-256: \`$sum\`
          EOF
          gh release create "$GITHUB_REF_NAME" dist/WarchestCompanion.exe dist/SHA256SUMS.txt --title "Warchest Companion ${{ steps.v.outputs.version }}" --notes-file notes.md
